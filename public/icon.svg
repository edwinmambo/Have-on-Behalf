<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Sacred Adventist Sanctuary Disc -->
  <defs>
    <radialGradient id="sdaBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="flameGoldLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="flameGoldCenter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="flameGoldRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="bookPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="flameAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="divineGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Protective Halo Circle -->
  <circle cx="256" cy="256" r="244" fill="url(#sdaBg)" stroke="#f59e0b" stroke-width="5" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="234" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Divine Warm Glow behind Flame -->
  <circle cx="256" cy="220" r="160" fill="url(#flameAura)"/>

  <!-- Iconic SDA Three-Fold Flame & Christian Cross Core -->
  <g filter="url(#divineGlow)">
    <!-- Left Sweeping Flame of the Holy Spirit -->
    <path d="M 234 300 C 218 250 172 215 182 145 C 191 90 234 50 248 35 C 236 75 246 122 228 165 C 214 202 200 240 234 300 Z" fill="url(#flameGoldLeft)"/>

    <!-- Right Sweeping Flame of the Holy Spirit -->
    <path d="M 278 300 C 294 250 340 215 330 145 C 321 90 278 50 264 35 C 276 75 266 122 284 165 C 298 202 312 240 278 300 Z" fill="url(#flameGoldRight)"/>

    <!-- Center Ascending Flame (Third Angel's Message) -->
    <path d="M 256 42 C 267 98 284 150 272 200 C 264 240 256 268 256 300 C 256 268 248 240 240 200 C 228 150 245 98 256 42 Z" fill="url(#flameGoldCenter)"/>

    <!-- Sacrificial Cross of Christ (Pure Light in Center) -->
    <!-- Vertical Cross Beam -->
    <rect x="250" y="115" width="12" height="180" rx="3" fill="#ffffff" fill-opacity="0.98"/>
    <!-- Horizontal Cross Beam -->
    <rect x="224" y="158" width="64" height="12" rx="3" fill="#ffffff" fill-opacity="0.98"/>
  </g>

  <!-- Open Word of God (Holy Scriptures & Hymnal Base) -->
  <g id="open-bible">
    <!-- Left Page Curves -->
    <path d="M 256 385 C 210 358 152 358 108 375 C 106 376 112 334 156 318 C 200 302 244 324 256 342 Z" fill="url(#bookPageGrad)"/>
    <!-- Right Page Curves -->
    <path d="M 256 385 C 302 358 360 358 404 375 C 406 376 400 334 356 318 C 312 302 268 324 256 342 Z" fill="url(#bookPageGrad)"/>

    <!-- Golden Book Spine & Bookmark Ribbon -->
    <path d="M 256 338 L 256 396 C 256 396 247 414 238 418 L 256 408 L 274 418 C 265 414 256 396 256 396 Z" fill="#f59e0b"/>

    <!-- Sacred Scripture Inscription Lines on Pages -->
    <line x1="135" y1="340" x2="232" y2="334" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="130" y1="352" x2="228" y2="346" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="125" y1="364" x2="222" y2="358" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

    <line x1="280" y1="334" x2="377" y2="340" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="284" y1="346" x2="382" y2="352" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="290" y1="358" x2="387" y2="364" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
