<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded rectangle (Safe zone aware) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.3" />

  <!-- Heavenly Rays -->
  <g opacity="0.15">
    <line x1="256" y1="90" x2="256" y2="40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="200" y1="110" x2="170" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <line x1="312" y1="110" x2="342" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <line x1="150" y1="150" x2="110" y2="130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <line x1="362" y1="150" x2="402" y2="130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Central Light Halo -->
  <circle cx="256" cy="230" r="130" fill="#f59e0b" opacity="0.08" filter="url(#glow)" />

  <!-- The Open Sacred Book (Scripture & EGW Writings) -->
  <g transform="translate(0, 20)">
    <!-- Book Spine Glow -->
    <path d="M256 160 C 210 140, 140 140, 96 156 L 96 340 C 140 324, 210 324, 256 344 C 302 324, 372 324, 416 340 L 416 156 C 372 140, 302 140, 256 160 Z" 
          fill="#1e293b" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- Left Book Page -->
    <path d="M256 165 C 214 147, 148 147, 108 162 L 108 335 C 148 320, 214 320, 256 338 Z" 
          fill="url(#pageGrad)" />
    
    <!-- Right Book Page -->
    <path d="M256 165 C 298 147, 364 147, 404 162 L 404 335 C 364 320, 298 320, 256 338 Z" 
          fill="url(#pageGrad)" />

    <!-- Book Page Text Lines (Left - Scripture / Prophecy) -->
    <line x1="130" y1="188" x2="234" y2="182" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="130" y1="208" x2="234" y2="202" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="130" y1="228" x2="234" y2="222" stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.9" /> <!-- Red letter line -->
    <line x1="130" y1="248" x2="210" y2="243" stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="130" y1="268" x2="234" y2="263" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="130" y1="288" x2="220" y2="283" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Book Page Text Lines (Right - Hymnal Musical Stave & Text) -->
    <line x1="278" y1="182" x2="382" y2="188" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="278" y1="194" x2="382" y2="200" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="278" y1="206" x2="382" y2="212" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Music notes on right page -->
    <circle cx="300" cy="190" r="4" fill="#0f172a" />
    <line x1="304" y1="190" x2="304" y2="174" stroke="#0f172a" stroke-width="2" />
    <circle cx="330" cy="196" r="4" fill="#0f172a" />
    <line x1="334" y1="196" x2="334" y2="180" stroke="#0f172a" stroke-width="2" />
    <circle cx="360" cy="202" r="4" fill="#0f172a" />
    <line x1="364" y1="202" x2="364" y2="186" stroke="#0f172a" stroke-width="2" />

    <line x1="278" y1="240" x2="382" y2="246" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="278" y1="260" x2="382" y2="266" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="278" y1="280" x2="350" y2="285" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Spine Divider & Ribbon -->
    <path d="M256 160 L 256 360 C 256 375, 275 380, 270 410 L 256 395 L 242 410 C 248 380, 256 375, 256 360 Z" 
          fill="url(#goldGrad)" />

    <!-- Radiant Cross atop center -->
    <g transform="translate(256, 120)">
      <rect x="-4" y="-36" width="8" height="42" rx="2" fill="url(#goldGrad)" filter="url(#glow)" />
      <rect x="-18" y="-26" width="36" height="8" rx="2" fill="url(#goldGrad)" filter="url(#glow)" />
    </g>
  </g>

  <!-- Golden Beam Projector Waves below -->
  <path d="M200 420 C 235 405, 277 405, 312 420" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M180 435 C 230 415, 282 415, 332 435" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5" />
</svg>
