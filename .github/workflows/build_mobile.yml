name: Build Mobile Companion & Bundle Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_mobile_and_bundle:
    name: Build Flutter Mobile App & Upload Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm install --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --force
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Synchronize Shared Datasets (Web PWA <-> Flutter Mobile Parity)
        run: npm run sync:data || echo "Using pre-synced canonical datasets in mobile/assets/data/"

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install & Configure Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Ensure Android Environment & Keystore
        run: |
          mkdir -p mobile/android/gradle/wrapper mobile/android/app ~/.android
          chmod +x mobile/android/gradlew || true
          if [ ! -f mobile/android/app/debug.keystore ]; then
            keytool -genkey -v -keystore mobile/android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          yes | flutter doctor --android-licenses || true
          flutter --version
          dart --version

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Execute Mobile Unit & Model Tests
        working-directory: mobile
        run: flutter test

      - name: Compile Universal Production Android APK
        working-directory: mobile
        run: |
          echo "Starting Flutter release APK compilation..."
          flutter build apk --release --no-tree-shake-icons --verbose 2>&1 | tee /tmp/flutter_build.log || {
            echo "::error::Flutter release APK build failed. Showing last 150 lines of build log:"
            tail -n 150 /tmp/flutter_build.log
            exit 1
          }
          echo "Generated APK files in mobile:"
          find . -name "*.apk" -ls || true

      - name: Compile Split-per-ABI Android APKs
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons || echo "Split ABI build completed with fallback"

      - name: Create /assets/releases Directory & Bundle Binaries
        run: |
          mkdir -p assets/releases public/assets/releases
          
          # Detect the freshly compiled release APK
          COMPILED_APK=""
          for p in "mobile/build/app/outputs/flutter-apk/app-release.apk" \
                   "mobile/android/app/build/outputs/apk/release/app-release.apk" \
                   "mobile/build/app/outputs/apk/release/app-release.apk"; do
            if [ -f "$p" ]; then
              COMPILED_APK="$p"
              break
            fi
          done
          
          if [ -n "$COMPILED_APK" ]; then
            echo "Bundling compiled APK from $COMPILED_APK ($(stat -c%s "$COMPILED_APK") bytes)"
            cp -f "$COMPILED_APK" assets/releases/HaveOnBehalf-Companion-v1.2.0.apk
            cp -f "$COMPILED_APK" assets/releases/HaveOnBehalf-Companion-Latest.apk
            cp -f "$COMPILED_APK" assets/releases/HaveOnBehalf-Companion-EarlyTester.apk
            cp -f "$COMPILED_APK" public/assets/releases/HaveOnBehalf-Companion-v1.2.0.apk || true
            cp -f "$COMPILED_APK" public/assets/releases/HaveOnBehalf-Companion-Latest.apk || true
            cp -f "$COMPILED_APK" public/assets/releases/HaveOnBehalf-Companion-EarlyTester.apk || true
          else
            echo "::error::No compiled APK found at standard outputs!"
            exit 1
          fi
          
          # Copy architecture-specific APKs if present
          [ -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && cp -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk assets/releases/HaveOnBehalf-Companion-arm64-v8a.apk || true
          [ -f mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && cp -f mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk assets/releases/HaveOnBehalf-Companion-armeabi-v7a.apk || true
          [ -f mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk ] && cp -f mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk assets/releases/HaveOnBehalf-Companion-x86_64.apk || true
          
          ls -lh assets/releases/*.apk

      - name: Generate Automated Git Changelog & Tester Release Notes
        run: npm run changelog:auto || true

      - name: Upload Release Artifacts to assets/releases
        uses: actions/upload-artifact@v4
        with:
          name: HaveOnBehalf-Mobile-Releases
          path: |
            assets/releases/*.apk
            assets/releases/TESTER_DISTRIBUTION_CHANGELOG.md
            assets/releases/manifest.json
            assets/releases/versions.json
          retention-days: 30

      - name: Commit Bundled Release Assets & Changelog
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Release Builder]"
          git add -f assets/releases/*.apk public/assets/releases/*.apk assets/releases/ public/assets/releases/ CHANGELOG.md package-lock.json
          git diff --staged --quiet || git commit -m "chore(release): bundle verified mobile release APKs [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Publish or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2.0"
          name: "Have On Behalf Companion v1.2.0 (Production Release)"
          body_path: assets/releases/TESTER_DISTRIBUTION_CHANGELOG.md
          files: |
            assets/releases/HaveOnBehalf-Companion-v1.2.0.apk
            assets/releases/HaveOnBehalf-Companion-Latest.apk
            assets/releases/HaveOnBehalf-Companion-EarlyTester.apk
            assets/releases/manifest.json
            assets/releases/versions.json
            assets/releases/TESTER_DISTRIBUTION_CHANGELOG.md
          draft: false
          prerelease: false
