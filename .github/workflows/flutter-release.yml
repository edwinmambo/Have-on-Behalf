name: Build Flutter Companion App & Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-distribute:
    name: Build Android APK, Bundle Assets & Generate Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm install --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --force
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Run Data Bridge Synchronization (Web <-> Mobile Parity)
        run: npm run sync:data || echo "Using pre-synced canonical datasets in mobile/assets/data/"

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses & Verify Environment
        run: |
          mkdir -p mobile/android/gradle/wrapper ~/.android
          chmod +x mobile/android/gradlew || true
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          yes | flutter doctor --android-licenses || true
          flutter --version
          dart --version

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Mobile Test Suite
        working-directory: mobile
        run: flutter test

      - name: Build Universal Android APK
        working-directory: mobile
        run: |
          flutter build apk --release --no-tree-shake-icons || {
            echo "Release build exited with code; trying with Gradle directly..."
            (cd android && ./gradlew assembleRelease --stacktrace --no-daemon) || flutter build apk --release --no-tree-shake-icons
          }

      - name: Build Split-per-ABI Android APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons || true

      - name: Bundle Release Binaries into /assets/releases/
        run: |
          mkdir -p assets/releases public/assets/releases
          
          if [ -f mobile/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp -f mobile/build/app/outputs/flutter-apk/app-release.apk assets/releases/HaveOnBehalf-Companion-v1.2.0.apk
            cp -f mobile/build/app/outputs/flutter-apk/app-release.apk assets/releases/HaveOnBehalf-Companion-Latest.apk
            cp -f mobile/build/app/outputs/flutter-apk/app-release.apk assets/releases/HaveOnBehalf-Companion-EarlyTester.apk
            cp -f mobile/build/app/outputs/flutter-apk/app-release.apk public/assets/releases/HaveOnBehalf-Companion-v1.2.0.apk || true
            cp -f mobile/build/app/outputs/flutter-apk/app-release.apk public/assets/releases/HaveOnBehalf-Companion-Latest.apk || true
            cp -f mobile/build/app/outputs/flutter-apk/app-release.apk public/assets/releases/HaveOnBehalf-Companion-EarlyTester.apk || true
          fi
          
          [ -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && cp -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk assets/releases/HaveOnBehalf-Companion-arm64-v8a.apk || true
          [ -f mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && cp -f mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk assets/releases/HaveOnBehalf-Companion-armeabi-v7a.apk || true
          [ -f mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk ] && cp -f mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk assets/releases/HaveOnBehalf-Companion-x86_64.apk || true

      - name: Generate Automated Git Changelog & Tester Release Notes
        run: npm run changelog:auto || true

      - name: Upload Tester APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HaveOnBehalf-Companion-Tester-APKs
          path: |
            assets/releases/*.apk
            assets/releases/TESTER_DISTRIBUTION_CHANGELOG.md
            assets/releases/manifest.json
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: assets/releases/TESTER_DISTRIBUTION_CHANGELOG.md
          files: |
            assets/releases/HaveOnBehalf-Companion-v1.2.0.apk
            assets/releases/HaveOnBehalf-Companion-Latest.apk
            assets/releases/HaveOnBehalf-Companion-EarlyTester.apk
            assets/releases/HaveOnBehalf-Companion-arm64-v8a.apk
            assets/releases/HaveOnBehalf-Companion-armeabi-v7a.apk
            assets/releases/manifest.json
            assets/releases/TESTER_DISTRIBUTION_CHANGELOG.md
          name: Have On Behalf Companion Release ${{ github.ref_name }}
          draft: false
          prerelease: false
