name: Build Flutter Companion App & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Tester Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Tests
        working-directory: mobile
        run: flutter test

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Build Universal Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Copy Artifacts to assets/
        run: |
          mkdir -p assets/releases
          cp mobile/build/app/outputs/flutter-apk/app-release.apk assets/releases/HaveOnBehalf-Companion-EarlyTester.apk || true
          cp -r mobile/build/app/outputs/flutter-apk/* assets/releases/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaveOnBehalf-Companion-APK
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/*-release.apk
          name: Have On Behalf Companion Early Tester Release ${{ github.ref_name }}
          body: |
            ### 📱 Have On Behalf (H.O.B) Companion App - Early Tester Release
            
            This early tester build includes:
            - **All 13 Canonical Hymnal Collections** (SDAH, NZK, NCA, NCA Old, WNY, OKN, KIN, CIS, KMN, ICB, SHO, UKE, SDAH Ext)
            - **Full Cross-Reference Concordance**: Seamless navigation between English, Swahili, and Gĩkũyũ editions
            - **Pitch Pipe Synthesizer**: Audio reference with liturgical key signatures (A-G♭/F♯)
            - **Worship Planning & Liturgy**: Divine Service, Vespers, Song Service planner
            - **Custom Themes**: Sanctuary Gold, Adventist Burgundy, Celestial Deep Blue, and Pure OLED Dark mode
            
            Download `app-release.apk` below and install it directly on your Android test device!
