name: Build Flutter Companion App & Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-distribute:
    name: Build Android APK, Bundle Assets & Generate Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm install --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --force
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Run Data Bridge Synchronization (Web <-> Mobile Parity)
        run: npm run sync:data || echo "Using pre-synced canonical datasets in mobile/assets/data/"

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Ensure Android Environment & Keystore
        run: |
          mkdir -p mobile/android/gradle/wrapper mobile/android/app ~/.android
          chmod +x mobile/android/gradlew || true
          if [ ! -f mobile/android/app/debug.keystore ]; then
            keytool -genkey -v -keystore mobile/android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          yes | flutter doctor --android-licenses || true
          flutter --version
          dart --version

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Mobile Test Suite
        working-directory: mobile
        run: flutter test

      - name: Build Universal Android APK
        working-directory: mobile
        run: |
          echo "Starting Universal Production Release APK compilation..."
          flutter build apk --release --no-tree-shake-icons --verbose 2>&1 | tee /tmp/flutter_build.log || {
            echo "::error::Flutter release APK build failed. Showing last 150 lines of build log:"
            tail -n 150 /tmp/flutter_build.log
            exit 1
          }
          
          mkdir -p ../assets/releases ../public/assets/releases
          UNIVERSAL_APK=$(find build/ android/ -name "*release.apk" ! -name "*split*" ! -name "*arm*" ! -name "*x86*" | head -n 1)
          if [ -z "$UNIVERSAL_APK" ]; then
            UNIVERSAL_APK=$(find build/ android/ -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$UNIVERSAL_APK" ]; then
            echo "Preserving compiled Universal APK from $UNIVERSAL_APK ($(stat -c%s "$UNIVERSAL_APK") bytes)..."
            cp -f "$UNIVERSAL_APK" ../assets/releases/HaveOnBehalf-Companion-v1.2.0.apk
            cp -f "$UNIVERSAL_APK" ../assets/releases/HaveOnBehalf-Companion-Latest.apk
            cp -f "$UNIVERSAL_APK" ../assets/releases/HaveOnBehalf-Companion-EarlyTester.apk
            cp -f "$UNIVERSAL_APK" ../public/assets/releases/HaveOnBehalf-Companion-v1.2.0.apk || true
            cp -f "$UNIVERSAL_APK" ../public/assets/releases/HaveOnBehalf-Companion-Latest.apk || true
            cp -f "$UNIVERSAL_APK" ../public/assets/releases/HaveOnBehalf-Companion-EarlyTester.apk || true
          fi

      - name: Build Split-per-ABI Android APKs
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons || true

      - name: Bundle Release Binaries into /assets/releases/
        run: |
          mkdir -p assets/releases public/assets/releases
          
          find mobile/ -name "*arm64-v8a*.apk" -exec cp -f {} assets/releases/HaveOnBehalf-Companion-arm64-v8a.apk \; 2>/dev/null || true
          find mobile/ -name "*armeabi-v7a*.apk" -exec cp -f {} assets/releases/HaveOnBehalf-Companion-armeabi-v7a.apk \; 2>/dev/null || true
          find mobile/ -name "*x86_64*.apk" -exec cp -f {} assets/releases/HaveOnBehalf-Companion-x86_64.apk \; 2>/dev/null || true
          
          if [ ! -f assets/releases/HaveOnBehalf-Companion-v1.2.0.apk ] || [ $(stat -c%s assets/releases/HaveOnBehalf-Companion-v1.2.0.apk) -lt 5000000 ]; then
            ANY_APK=$(find mobile/ -name "*.apk" | head -n 1)
            if [ -n "$ANY_APK" ]; then
              cp -f "$ANY_APK" assets/releases/HaveOnBehalf-Companion-v1.2.0.apk
              cp -f "$ANY_APK" assets/releases/HaveOnBehalf-Companion-Latest.apk
              cp -f "$ANY_APK" assets/releases/HaveOnBehalf-Companion-EarlyTester.apk
              cp -f "$ANY_APK" public/assets/releases/HaveOnBehalf-Companion-v1.2.0.apk || true
              cp -f "$ANY_APK" public/assets/releases/HaveOnBehalf-Companion-Latest.apk || true
              cp -f "$ANY_APK" public/assets/releases/HaveOnBehalf-Companion-EarlyTester.apk || true
            fi
          fi
          
          ls -lh assets/releases/*.apk

      - name: Generate Automated Git Changelog & Tester Release Notes
        run: npm run changelog:auto || true

      - name: Upload Tester APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HaveOnBehalf-Companion-Tester-APKs
          path: |
            assets/releases/*.apk
            assets/releases/TESTER_DISTRIBUTION_CHANGELOG.md
            assets/releases/manifest.json
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2.0"
          name: "Have On Behalf Companion v1.2.0 (Production Release)"
          body_path: assets/releases/TESTER_DISTRIBUTION_CHANGELOG.md
          files: |
            assets/releases/HaveOnBehalf-Companion-v1.2.0.apk
            assets/releases/HaveOnBehalf-Companion-Latest.apk
            assets/releases/HaveOnBehalf-Companion-EarlyTester.apk
            assets/releases/manifest.json
            assets/releases/versions.json
            assets/releases/TESTER_DISTRIBUTION_CHANGELOG.md
          draft: false
          prerelease: false
