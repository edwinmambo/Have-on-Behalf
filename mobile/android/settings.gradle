pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProp = file("local.properties")
        if (localProp.exists()) {
            localProp.withInputStream { properties.load(it) }
        }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        if (flutterSdkPath == null || !file(flutterSdkPath).exists()) {
            flutterSdkPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
        }
        if (flutterSdkPath == null || !file(flutterSdkPath).exists()) {
            try {
                def proc = "which flutter".execute()
                proc.waitFor()
                def flutterBin = proc.text.trim()
                if (flutterBin) {
                    flutterSdkPath = file(flutterBin).parentFile.parentFile.absolutePath
                }
            } catch (Exception e) {}
        }
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties and FLUTTER_ROOT not found"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"
